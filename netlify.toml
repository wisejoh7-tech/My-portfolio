[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["templates/**", "static/**", "ml_models.py"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/predict/*"
  to = "/.netlify/functions/server/predict/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  conditions = {Role = ["*"]}
