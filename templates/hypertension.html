<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertension Prediction & Clinical Metrics</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css">
    <script src="/static/index.js" defer></script>
</head>
<body style="width: 90%; margin: 20px auto; color:white;">
    <nav class="navbar" style="margin-bottom:20px; border-radius:15px;">
        <div class="logo"><a href="/" style="color:#38bdf8; text-decoration:none;">MyPortfolio</a></div>
        <div class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="{{ url_for('projects') }}">All Projects</a>
            <a href="{{ url_for('diabetes') }}">Diabetes</a>
            <a href="{{ url_for('typhoid') }}">Typhoid</a>
            <a href="{{ url_for('ecommerce') }}">E-commerce</a>
            <button onclick="toggleMode()">🌙</button>
        </div>
    </nav>

    <h2>Hypertension Risk Analysis & Evaluation</h2>

    <!-- Interactive Prediction Section -->
    <div class="card" style="border: 1px solid #38bdf8; padding: 20px; margin-bottom: 25px;">
        <h3 style="color:#38bdf8; margin-bottom: 10px;">❤️ Interactive Blood Pressure & Hypertension Classifier</h3>
        <p style="margin-bottom:15px; font-size:14px; color:#cbd5e1;">Test clinical blood pressure parameters against the Random Forest classifier:</p>
        <form id="hypertensionForm" onsubmit="event.preventDefault(); runPrediction('/predict/hypertension', 'hypertensionForm', 'hypertensionResult');" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px; align-items: end;">
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Age (years):</label>
                <input type="number" name="age" value="52" min="18" max="100" step="1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Systolic BP (mmHg):</label>
                <input type="number" name="systolic_bp" value="138" min="80" max="230" step="1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Diastolic BP (mmHg):</label>
                <input type="number" name="diastolic_bp" value="88" min="50" max="140" step="1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">BMI (kg/m²):</label>
                <input type="number" name="bmi" value="27.4" min="15" max="55" step="0.1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Heart Rate (bpm):</label>
                <input type="number" name="heart_rate" value="76" min="40" max="160" step="1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <button type="submit" class="dropdown-btn" style="width:100%; height:40px;">Evaluate Risk</button>
            </div>
        </form>
        <div id="hypertensionResult" style="display:none; margin-top:15px;"></div>
    </div>

    <footer style="margin-top:30px;">
        <p>© 2026 Osamudiamen | AI Healthcare Portfolio</p>
    </footer>
</body>
</html>
