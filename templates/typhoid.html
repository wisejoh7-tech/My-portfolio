<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typhoid Diagnostic Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/index.css">
    <script src="/static/index.js" defer></script>
</head>
<body style="width: 90%; margin: 20px auto; color:white;">
    <nav class="navbar" style="margin-bottom:20px; border-radius:15px;">
        <div class="logo"><a href="/" style="color:#38bdf8; text-decoration:none;">MyPortfolio</a></div>
        <div class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="{{ url_for('projects') }}">All Projects</a>
            <a href="{{ url_for('diabetes') }}">Diabetes</a>
            <a href="{{ url_for('hypertension') }}">Hypertension</a>
            <a href="{{ url_for('ecommerce') }}">E-commerce</a>
            <button onclick="toggleMode()">🌙</button>
        </div>
    </nav>

    <h2>Typhoid Diagnostic & Laboratory Classification</h2>

    <!-- Interactive Typhoid Diagnosis Section -->
    <div class="card" style="border: 1px solid #38bdf8; padding: 20px; margin-bottom: 25px;">
        <h3 style="color:#38bdf8; margin-bottom: 10px;">🧪 Interactive Typhoid Diagnosis Tool</h3>
        <p style="margin-bottom:15px; font-size:14px; color:#cbd5e1;">Assess infection likelihood from clinical markers:</p>
        <form id="typhoidForm" onsubmit="event.preventDefault(); runPrediction('/predict/typhoid', 'typhoidForm', 'typhoidResult');" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end;">
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Patient Age:</label>
                <input type="number" name="age" value="32" min="1" max="100" step="1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Fever Temp (°C):</label>
                <input type="number" name="fever_temp" value="39.2" min="35.0" max="43.0" step="0.1" required style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Abdominal Pain:</label>
                <select name="abdominal_pain" style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
                    <option value="1">Present (Yes)</option>
                    <option value="0">Absent (No)</option>
                </select>
            </div>
            <div>
                <label style="font-size:12px; display:block; margin-bottom:5px;">Widal Test Result:</label>
                <select name="widal_test" style="width:100%; padding:8px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:white;">
                    <option value="1">Positive</option>
                    <option value="0">Negative</option>
                </select>
            </div>
            <div>
                <button type="submit" class="dropdown-btn" style="width:100%; height:40px;">Run Diagnosis</button>
            </div>
        </form>
        <div id="typhoidResult" style="display:none; margin-top:15px;"></div>
    </div>

    <footer style="margin-top:30px;">
        <p>© 2026 Osamudiamen | AI Healthcare Portfolio</p>
    </footer>
</body>
</html>
